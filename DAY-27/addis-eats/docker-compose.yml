# Explicit project name: both days live in a folder called "addis-eats",
# and without this Compose would derive the same project name for each.
name: addis-eats-day27

services:
  # Development: hot-reloading Vite server on http://localhost:5174
  web:
    build:
      context: .
      target: dev
    container_name: addis-eats-day27-dev
    ports:
      - "5174:5173"
    volumes:
      # Mount the source for live reload, but keep the image's node_modules.
      # ":z" relabels the mount for SELinux hosts (Fedora/RHEL); harmless elsewhere.
      - .:/app:z
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Production preview: static build behind nginx on http://localhost:8087
  # Started only on demand: docker compose --profile prod up prod
  prod:
    build:
      context: .
      target: prod
    container_name: addis-eats-day27-prod
    ports:
      - "8087:80"
    profiles: ["prod"]
