services:
  # ── Production build served by Nginx ──────────────────────────
  campus-connect:
    build:
      context: .
      target: production
    container_name: campus-connect
    ports:
      - "3000:80"
    restart: unless-stopped

  # ── Dev server with hot-reload ─────────────────────────────────
  campus-connect-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: campus-connect-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    profiles:
      - dev
