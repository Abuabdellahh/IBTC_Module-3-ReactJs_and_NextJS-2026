<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280" />
<title>MediQueue — My Appointments</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; color: #111827; }

  .navbar { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .navbar-inner { max-width: 1152px; margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo-text { font-weight: 700; font-size: 20px; color: #0ea5e9; }
  .nav-links { display: flex; align-items: center; gap: 24px; }
  .nav-link { font-size: 14px; font-weight: 500; color: #4b5563; text-decoration: none; }
  .nav-link.active { color: #0ea5e9; }
  .nav-btn { background: #0ea5e9; color: #fff; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; text-decoration: none; }

  .page { max-width: 896px; margin: 0 auto; padding: 40px 16px; }
  .page-title { font-size: 30px; font-weight: 700; color: #1f2937; margin-bottom: 6px; }
  .page-sub { color: #6b7280; font-size: 14px; margin-bottom: 32px; }

  .apt-list { display: flex; flex-direction: column; gap: 16px; }
  .apt-card { background: #fff; border-radius: 12px; border: 1px solid #f3f4f6; box-shadow: 0 1px 3px rgba(0,0,0,.05); padding: 20px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit; }
  .apt-left { display: flex; align-items: center; gap: 16px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e0f2fe; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .apt-name { font-weight: 600; color: #1f2937; font-size: 15px; }
  .apt-spec { font-size: 13px; color: #6b7280; margin-top: 2px; }
  .apt-right { text-align: right; }
  .apt-date { font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px; }
  .badge { padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .badge.confirmed { background: #dcfce7; color: #15803d; }
  .badge.pending { background: #fef9c3; color: #a16207; }

  .footer { background: #1f2937; color: #9ca3af; font-size: 13px; text-align: center; padding: 24px; margin-top: 48px; }
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="#"><span style="font-size:24px">🏥</span><span class="logo-text">MediQueue</span></a>
    <nav class="nav-links">
      <a class="nav-link" href="#">Home</a>
      <a class="nav-link" href="#">Doctors</a>
      <a class="nav-link active" href="#">My Appointments</a>
      <a class="nav-btn" href="#">Login</a>
    </nav>
  </div>
</div>

<div class="page">
  <h1 class="page-title">My Appointments</h1>
  <p class="page-sub">Track and manage your upcoming visits</p>

  <div class="apt-list">

    <div class="apt-card">
      <div class="apt-left">
        <div class="avatar">👨⚕️</div>
        <div>
          <div class="apt-name">Dr. Aisha Bekele</div>
          <div class="apt-spec">General Practice</div>
        </div>
      </div>
      <div class="apt-right">
        <div class="apt-date">2026-09-25 · 09:00 AM</div>
        <span class="badge confirmed">confirmed</span>
      </div>
    </div>

    <div class="apt-card">
      <div class="apt-left">
        <div class="avatar">👨⚕️</div>
        <div>
          <div class="apt-name">Dr. Samuel Tesfaye</div>
          <div class="apt-spec">Pediatrics</div>
        </div>
      </div>
      <div class="apt-right">
        <div class="apt-date">2026-09-27 · 11:00 AM</div>
        <span class="badge pending">pending</span>
      </div>
    </div>

  </div>
</div>

<div class="footer">© 2026 MediQueue — Skip the Line, Not the Care</div>
</body>
</html>
