<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280" />
<title>MediQueue — Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; color: #111827; }

  .navbar { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .navbar-inner { max-width: 1152px; margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo-text { font-weight: 700; font-size: 20px; color: #0ea5e9; }
  .nav-links { display: flex; align-items: center; gap: 24px; }
  .nav-link { font-size: 14px; font-weight: 500; color: #4b5563; text-decoration: none; }
  .nav-btn { background: #0ea5e9; color: #fff; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; text-decoration: none; }

  .main { min-height: calc(100vh - 64px - 56px); display: flex; align-items: center; justify-content: center; padding: 40px 16px; }

  .card { background: #fff; border-radius: 16px; border: 1px solid #f3f4f6; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 32px; width: 100%; max-width: 420px; }
  .card-header { text-align: center; margin-bottom: 24px; }
  .card-icon { font-size: 40px; display: block; margin-bottom: 8px; }
  .card-title { font-size: 22px; font-weight: 700; color: #1f2937; }
  .card-sub { font-size: 13px; color: #6b7280; margin-top: 4px; }

  .form { display: flex; flex-direction: column; gap: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px; }
  .field input { width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #374151; outline: none; }
  .field input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.15); }
  .field input::placeholder { color: #9ca3af; }

  .btn-signin { background: #0ea5e9; color: #fff; font-weight: 600; padding: 12px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; width: 100%; margin-top: 8px; }

  .register-text { text-align: center; font-size: 13px; color: #6b7280; margin-top: 16px; }
  .register-link { color: #0ea5e9; cursor: pointer; }

  .auth-notice { margin-top: 16px; padding: 10px 12px; background: #fefce8; border: 1px solid #fde68a; border-radius: 8px; font-size: 11px; color: #92400e; text-align: center; }

  .footer { background: #1f2937; color: #9ca3af; font-size: 13px; text-align: center; padding: 24px; }
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="#"><span style="font-size:24px">🏥</span><span class="logo-text">MediQueue</span></a>
    <nav class="nav-links">
      <a class="nav-link" href="#">Home</a>
      <a class="nav-link" href="#">Doctors</a>
      <a class="nav-link" href="#">My Appointments</a>
      <a class="nav-btn" href="#">Login</a>
    </nav>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="card-header">
      <span class="card-icon">🏥</span>
      <div class="card-title">Welcome Back</div>
      <div class="card-sub">Sign in to manage your appointments</div>
    </div>

    <div class="form">
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" />
      </div>
      <button class="btn-signin">Sign In</button>
    </div>

    <p class="register-text">Don't have an account? <span class="register-link">Register</span></p>

    <div class="auth-notice">🔒 Authentication coming soon — protected routes will be wired here</div>
  </div>
</div>

<div class="footer">© 2026 MediQueue — Skip the Line, Not the Care</div>
</body>
</html>
